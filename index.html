/* Tydlig målbild och ceremoni vid världsskifte */
.goal-picture{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid #ebc77a;border-radius:15px;background:linear-gradient(125deg,#66328a,#25103d);margin:9px 0;box-shadow:0 0 15px #ad59f85c}
.goal-icon{font-size:54px;flex:0 0 66px;text-align:center;filter:drop-shadow(0 0 9px #ffdc79)}
.goal-info{flex:1;min-width:0}.goal-info strong{display:block;color:#ffe8a1;font-size:15px}.goal-info span{font-size:13px}.goal-pbar{height:9px;background:#150a28;border-radius:10px;overflow:hidden;margin:6px 0}.goal-pbar>i{display:block;height:100%;background:linear-gradient(90deg,#36d2ac,#fbd36d);border-radius:10px;transition:width .2s}
.realm-celebration{text-align:center;border:2px solid #f7ce78;background:radial-gradient(circle at 50% 20%,#813fb2,#230d43 78%);padding:18px 9px;border-radius:20px;box-shadow:0 0 35px #a348cb80}
.realm-icon{font-size:75px;display:block;animation:realm-bounce 1.2s ease-in-out infinite alternate}
.realm-celebration h2{font:900 26px Georgia,serif;color:#ffe5a3;text-shadow:0 0 15px #f8ac4f;margin:10px 0}
.realm-complete{color:#ffe1a1;font-weight:800;letter-spacing:1px}.realm-arrow{font-size:35px;color:#ffe1a1;margin:5px}
.world.done{border-color:#e3bf68;background:linear-gradient(100deg,#51401d,#28143e)}
@keyframes realm-bounce{from{transform:scale(.94)}to{transform:scale(1.08)}}
</style></head><body><div id="app"></div><script>
(()=>{'use strict';const KEY='XYNTHERIA-gold-tap-v1',MAX=200,LIFE_MS=30*60*1000;const WORLDS=[['Guldgruvan','🏰'],['Den förlorade djungeln','🌿'],['Isriket','❄️'],['Vulkanriket','🌋'],['Skuggskogen','🌲'],['Soltemplet','☀️'],['Kristallbergen','💎'],['Månslätten','🌙'],['Drakporten','🐉'],['Kronans rike','👑']];const SYMBOLS=[['🪙','Guldmynt',50],['💎','Diamant',90],['❤️‍🔥','Rubin',75],['💚','Smaragd',70],['🔮','Ametist',95],['👑','Krona',120],['⚜️','Ankh',100],['🦪','Pärla',80],['🪷','Lotus',85],['⭐','Stjärna',110]];const fresh=()=>({level:1,best:1,coins:400,gems:30,lives:5,lifeAt:Date.now(),scores:{},stars:{},inventory:{hammer:3,shield:2,slow:2},gift:'',name:'Spelare',adFree:false,worldReward:{}});let s;try{s={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s=fresh()}s.inventory={...fresh().inventory,...s.inventory};s.scores=s.scores||{};s.stars=s.stars||{};s.worldReward=s.worldReward||{};s.level=clampNumber(s.level,1,200);s.best=clampNumber(s.best,1,200);function clampNumber(v,min,max){return Math.max(min,Math.min(max,Number(v)||min))}let view='home',modal='',round=null,raf=0,last=0,spawnClock=0,ids=0,toast='';const $=()=>document.getElementById('app');const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}};const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const worldOf=n=>Math.floor((n-1)/20);const today=()=>new Date().toLocaleDateString('sv-SE');function refreshLives(){if(s.lives>=5){s.lifeAt=Date.now();return}let n=Math.floor((Date.now()-s.lifeAt)/LIFE_MS);if(n>0){s.lives=Math.min(5,s.lives+n);s.lifeAt+=n*LIFE_MS;if(s.lives===5)s.lifeAt=Date.now();save()}}function spendLife(){refreshLives();if(s.lives<1)return false;if(s.lives===5)s.lifeAt=Date.now();s.lives--;save();return true}function timeUntil(){refreshLives();if(s.lives===5)return 'Fullt';let rem=LIFE_MS-(Date.now()-s.lifeAt);return `${Math.floor(rem/60000)}:${String(Math.floor(rem/1000)%60).padStart(2,'0')}`}function chrome(){refreshLives();return `<header class="top"><div><div class="logo">♛ XYNTHERIA</div><div class="sub">THE TEN REALMS</div></div><div class="wallet">🪙 ${s.coins} &nbsp; 💎 ${s.gems}<br>❤️ ${s.lives}/5 ${s.lives<5?'⏳ '+timeUntil():''}</div></header>`}function btn(label,act,cls='purple',extra=''){return `<button class="button ${cls}" data-act="${act}" ${extra}>${label}</button>`}function nav(){return `<nav class="nav">${btn('🏰 Hem','home')}${btn('🗺️ Världar','map')}${btn('🛒 Butik','shop')}${btn('🏆 Topplista','ranking')}</nav>`}function home(){return `<div class="panel hero"><div class="sub">10 VÄRLDAR • 200 NIVÅER</div><h1>XYNTHERIA</h1><p>Samla skatter, undvik bomber och erövra de tio rikena!</p>${btn('▶ SPELA NIVÅ '+s.level,'play','')}</div><div class="panel"><div class="row"><strong>🗺️ ${WORLDS[worldOf(s.level)][0]}</strong><span class="tag">Nivå ${s.level}/200</span></div><div class="meter"><div class="fill" style="width:${((s.level-1)%20)*5}%"></div></div><p class="small">Fånga skatterna som dyker upp. Undvik bomber och dynamit. Klara varje nivåmål för att låsa upp nästa värld.</p><div class="row">${btn('🎁 Dagens gåva','gift','gold',s.gift===today()?'disabled':'')}${btn('💎 Butik','shop')}</div></div>${nav()}`}function map(){return `<div class="panel"><h2>🗺️ De tio världarna</h2><p class="small center">20 nivåer i varje värld. Slutför en värld för att öppna nästa.</p>${WORLDS.map(([name,em],i)=>`<div class="world ${s.best>(i+1)*20?'done':''}"><div class="emoji">${em}</div><div style="flex:1"><strong>${i+1}. ${name}</strong><small>Nivå ${i*20+1}–${i*20+20} • ${s.best>(i+1)*20?'🏆 AVKLARAD':s.best>i*20?'✨ Upplåst':'🔒 Låst'}</small></div>${btn(s.best>i*20?'Spela':'🔒','world','purple',`data-i="${i}" ${s.best<=i*20?'disabled':''}`)}</div>`).join('')}</div>${nav()}`}function setupLevel(n){const w=worldOf(n),j=(n-1)%20;return {n,w,goal:450+j*65+w*270,collect:4+Math.floor(j/3)+w,kind:(j+w)%SYMBOLS.length,duration:37+Math.min(15,j),speed:82+Math.min(95,w*9+j*2),spawn:Math.max(320,740-w*29-j*13),hazard:Math.min(.27,.09+w*.012+j*.005),collectCount:0,points:0,remaining:0,entities:[],shield:0,slowUntil:0,active:true,won:false,missed:0}}function prep(){let cfg=setupLevel(s.level);modal=`<div style="font-size:62px">${WORLDS[cfg.w][1]}</div><h2>Nivå ${cfg.n}</h2><p>${WORLDS[cfg.w][0]}</p><div class="goal-picture"><div class="goal-icon">${SYMBOLS[cfg.kind][0]}</div><div class="goal-info"><strong>🎯 DIN MÅLBILD</strong><span>Samla <b>${cfg.collect} ${SYMBOLS[cfg.kind][1].toLowerCase()}</b></span><div class="goal-pbar"><i style="width:0%"></i></div><span>Och nå <b>${cfg.goal} poäng</b></span></div></div><p class="small">Du har ${cfg.duration} sekunder. Tryck på skatterna, men undvik 💣 och 🧨.</p>${btn('STARTA ▶','start','')}${btn('Tillbaka','map')}`;render()}function start(){refreshLives();if(s.lives<1){modal=`<div style="font-size:60px">❤️</div><h2>Slut på liv</h2><p>Nästa liv om ${timeUntil()}. Du kan vänta eller köpa liv med gems.</p>${btn('Till butiken','shop','gold')}${btn('Tillbaka','home')}`;render();return}round=setupLevel(s.level);round.remaining=round.duration;modal='';view='game';render();last=performance.now();spawnClock=0;spawn();spawn();spawn();paint();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}function game(){const g=round;return `<div class="panel"><div class="gamehead"><div class="stat"><small>NIVÅ</small><b>${g.n}</b></div><div class="stat"><small>TID KVAR</small><b id="timer">${Math.ceil(g.remaining)}s</b></div><div class="stat"><small>POÄNG</small><b id="score">${g.points}</b></div></div><div class="goal-picture"><div class="goal-icon">${SYMBOLS[g.kind][0]}</div><div class="goal-info"><strong>🎯 NIVÅNS MÅLBILD</strong><span>Samla <b id="count">${g.collectCount}</b> av <b>${g.collect}</b> ${SYMBOLS[g.kind][1].toLowerCase()}</span><div class="goal-pbar"><i id="collect-progress" style="width:0%"></i></div><span>⭐ Poäng: <b id="goal-score">${g.points}</b> / ${g.goal}</span><div class="goal-pbar"><i id="progress" style="width:0%"></i></div></div></div></div><div id="field" class="playfield"></div><div class="toast" id="toast">Fånga symbolerna där de dyker upp! Undvik bomberna!</div><div class="boosters"><button class="boost" data-act="hammer">🔨<small>Hammare (${s.inventory.hammer})</small></button><button class="boost" data-act="shield">🛡️<small>Skydd (${s.inventory.shield})</small></button><button class="boost" data-act="slow">⏳<small>Sakta ner (${s.inventory.slow})</small></button><button class="boost" data-act="pause">⏸️<small>Pausa</small></button></div><p class="notice">Varje tryck räknas • Bomber −150 • Dynamit −300</p>`}function render(){if(view!=='game'){cancelAnimationFrame(raf);raf=0}let body=view==='home'?home():view==='map'?map():view==='game'&&round?game():view==='shop'?shop():view==='ranking'?ranking():view==='profile'?profile():home();$().innerHTML=chrome()+body+(modal?`<div class="overlay"><div class="dialog">${modal}</div></div>`:'');if(view==='game'&&round)paint()}function paint(){if(!round)return;let f=document.getElementById('field');if(!f)return;let active=new Set();for(let e of round.entities){active.add(String(e.id));let z=f.querySelector('[data-drop="'+e.id+'"]');if(!z){z=document.createElement('button');z.type='button';z.className='drop '+((e.type==='bomb'||e.type==='dynamite')?'hazard':'')+' '+(e.type==='chest'?'special':'');z.dataset.drop=String(e.id);z.setAttribute('aria-label',e.label||e.type);z.textContent=e.icon;f.appendChild(z)}z.style.left=e.x+'%';z.style.top=e.y+'px'}for(let z of f.querySelectorAll('[data-drop]'))if(!active.has(z.dataset.drop))z.remove()}function spawn(){const r=round;if(!r||!r.active)return;const f=document.getElementById('field');const height=f?f.clientHeight:410;const width=f?f.clientWidth:350;const margin=38;let px=margin+Math.random()*Math.max(1,width-2*margin),py=margin+Math.random()*Math.max(1,height-2*margin);for(let tries=0;tries<22;tries++){const overlap=r.entities.some(e=>Math.hypot(e.x/100*width-px,e.y-py)<76);if(!overlap)break;px=margin+Math.random()*Math.max(1,width-2*margin);py=margin+Math.random()*Math.max(1,height-2*margin)}const x=100*px/width,roll=Math.random();let type='treasure',icon,label,val,kind=-1;if(roll<r.hazard*.36){type='dynamite';icon='🧨';val=-300}else if(roll<r.hazard){type='bomb';icon='💣';val=-150}else if(roll>.977){type='chest';icon='🎁';val=220}else{let pool=Math.min(10,5+Math.floor((r.n-1)/11));kind=Math.random()<.32?r.kind:Math.floor(Math.random()*pool);kind=clamp(kind,0,9);icon=SYMBOLS[kind][0];val=SYMBOLS[kind][2];label=SYMBOLS[kind][1]}r.entities.push({id:++ids,x,y:py,type,icon,kind,val,label,expires:performance.now()+(2600+Math.random()*1000)})}function tick(now){if(view!=='game'||!round||!round.active||modal)return;let dt=Math.min(.07,(now-last)/1000);last=now;let r=round;r.remaining=Math.max(0,r.remaining-dt);spawnClock+=dt*1000;while(spawnClock>=r.spawn){spawnClock-=r.spawn;if(r.entities.length<9)spawn()}const slower=now<r.slowUntil;r.entities=r.entities.filter(e=>{if(now<e.expires+(slower?2500:0))return true;if(e.kind===r.kind)r.missed++;return false});const score=document.getElementById('score'),timer=document.getElementById('timer'),count=document.getElementById('count'),p=document.getElementById('progress');if(score)score.textContent=r.points;if(timer)timer.textContent=Math.ceil(r.remaining)+'s';if(count)count.textContent=r.collectCount;if(p)p.style.width=`${Math.min(100,100*Math.max(0,r.points)/r.goal)}%`;let cp=document.getElementById('collect-progress');if(cp)cp.style.width=`${Math.min(100,100*r.collectCount/r.collect)}%`;let gs=document.getElementById('goal-score');if(gs)gs.textContent=r.points;paint();if(r.points>=r.goal&&r.collectCount>=r.collect){finish(true);return}if(r.remaining<=0){finish(false);return}raf=requestAnimationFrame(tick)}function pop(x,y,text){let f=document.getElementById('field');if(!f)return;let z=document.createElement('span');z.className='float';z.style.left=x+'%';z.style.top=y+'px';z.textContent=text;f.appendChild(z);setTimeout(()=>z.remove(),850)}function hit(id){let r=round;if(view!=='game'||!r?.active||modal)return;let i=r.entities.findIndex(e=>e.id===id);if(i<0)return;let e=r.entities.splice(i,1)[0];if((e.type==='bomb'||e.type==='dynamite')&&r.shield>0){r.shield--;toast='🛡️ Skyddet stoppade explosionen!';pop(e.x,e.y,'🛡️');return}r.points=Math.max(0,r.points+e.val);if(e.kind===r.kind)r.collectCount++;if(e.type==='chest'){s.coins+=20;save()}toast=e.val<0?`💥 ${e.val} poäng!`:`✨ +${e.val} poäng!`;pop(e.x,e.y,(e.val>0?'+':'')+e.val);let t=document.getElementById('toast');if(t)t.textContent=toast;paint();if(r.points>=r.goal&&r.collectCount>=r.collect)finish(true)}function finish(won){let r=round;if(!r?.active)return;r.active=false;cancelAnimationFrame(raf);if(won){let star=r.remaining>r.duration*.5?3:r.remaining>r.duration*.2?2:1;let coins=90+star*35+r.w*20;s.stars[r.n]=Math.max(s.stars[r.n]||0,star);s.scores[r.n]=Math.max(s.scores[r.n]||0,r.points);s.coins+=coins;let old=r.n;s.best=Math.max(s.best,Math.min(MAX,s.level+1));s.level=Math.min(MAX,s.level+1);let reward='';if(old%20===0&&!s.worldReward[old]){s.gems+=15;s.worldReward[old]=true;reward='🎁 +15 gems'}save();if(old%20===0){const done=WORLDS[r.w],upcoming=WORLDS[r.w+1];modal=`<div class="realm-celebration"><span class="realm-icon">${done[1]}</span><div class="realm-complete">🏆 VÄRLD ${r.w+1} AVKLARAD! 🏆</div><h2>${done[0]}</h2><div class="stars">${'⭐'.repeat(star)}</div><p>Du har klarat alla 20 nivåer!<br>✨ ${r.points} poäng • 🪙 +${coins} mynt<br>${reward}</p>${upcoming?`<div class="realm-arrow">⬇️</div><div class="realm-complete">🔓 NY VÄRLD UPPLÅST!</div><span class="realm-icon">${upcoming[1]}</span><h2>${upcoming[0]}</h2>${btn('🌟 GÅ IN I NYA VÄRLDEN','enterworld','gold')}`:`<span class="realm-icon">👑</span><h2>DU HAR KLARAT ALLA TIO VÄRLDAR!</h2>${btn('Se världskartan','map','gold')}`}${btn('Världskarta','map')}</div>`}else{modal=`<div style="font-size:52px">🏆</div><h2>Nivå ${old} klar!</h2><div class="stars">${'⭐'.repeat(star)}</div><p>✨ ${r.points} poäng<br>🪙 +${coins} mynt</p>${btn('Nästa nivå ▶','play','')}${btn('Hem','home')}`}}else{spendLife();save();modal=`<div style="font-size:60px">💔</div><h2>Tiden är slut!</h2><p>${r.points}/${r.goal} poäng<br>${SYMBOLS[r.kind][0]} ${r.collectCount}/${r.collect} insamlade<br>❤️ ${s.lives} liv kvar</p>${btn('Försök igen','play','')}${btn('Köp liv','shop','gold')}${btn('Världskarta','map')}`}render()}function booster(which){let r=round;if(!r?.active)return;if(!s.inventory[which]){modal=`<h2>Slut på boosters</h2><p>Du kan köpa fler i butiken.</p>${btn('Butik','shop','gold')}${btn('Fortsätt spela','resume')}`;r.active=false;cancelAnimationFrame(raf);render();return}s.inventory[which]--;save();if(which==='hammer'){let bombs=r.entities.filter(e=>e.val<0);if(bombs.length){r.entities=r.entities.filter(e=>e.id!==bombs[0].id);toast='🔨 Tog bort en bomb!'}else{r.points+=110;toast='🔨 Bonus +110 poäng!'}}if(which==='shield'){r.shield+=2;toast='🛡️ Skyddar mot två bomber!'}if(which==='slow'){r.slowUntil=performance.now()+7000;toast='⏳ Symbolerna stannar kvar längre i 7 sekunder!'}let t=document.getElementById('toast');if(t)t.textContent=toast;let b=document.querySelector(`[data-act="${which}"] small`);if(b)b.textContent=which==='hammer'?`Hammare (${s.inventory.hammer})`:which==='shield'?`Skydd (${s.inventory.shield})`:`Sakta ner (${s.inventory.slow})`}function shop(){return `<div class="panel"><h2>🛒 Magiska butiken</h2><p class="small center">Du har 🪙 ${s.coins} mynt och 💎 ${s.gems} gems.</p>${[['❤️','5 liv','25 gems','lives'],['🔨','3 hammare','120 mynt','hammer'],['🛡️','3 skydd','120 mynt','shield'],['⏳','3 tidsboosters','120 mynt','slow'],['💎','50 gems','Testköp 19 kr','gems'],['💰','500 mynt','Testköp 19 kr','coins'],['🚫','Ta bort reklam','Testköp 49 kr','ads']].map(([e,name,price,act])=>`<div class="shopitem"><span style="font-size:30px">${e}</span><div style="flex:1"><b>${name}</b><div class="small">${price}</div></div>${btn(act==='ads'&&s.adFree?'Köpt':'Välj','buy','gold',`data-item="${act}" ${act==='ads'&&s.adFree?'disabled':''}`)}</div>`).join('')}<p class="notice">Testbutik: inga riktiga pengar debiteras. Betalning och annonser kräver senare integration med en betal-/annonsplattform. Reklam visas inte i den här prototypen.</p></div>${nav()}`}function buy(item){if(item==='lives'){if(s.gems<25){modal=`<h2>För få gems</h2><p>Du behöver 25 gems för att fylla på liv.</p>${btn('OK','close')}`;render();return}s.gems-=25;s.lives=5;s.lifeAt=Date.now()}else if(['hammer','shield','slow'].includes(item)){if(s.coins<120){modal=`<h2>För få mynt</h2>${btn('OK','close')}`;render();return}s.coins-=120;s.inventory[item]+=3}else{modal=`<h2>🛍️ Testköp</h2><p>Det här är en demo. Inga pengar dras. I en publicerad app ska köpet verifieras via App Store eller Google Play.</p>${btn('Simulera köp','simulate','gold',`data-item="${item}"`)}${btn('Avbryt','close')}`;render();return}save();modal=`<h2>✨ Klart!</h2><p>Dina varor finns nu i spelet.</p>${btn('Till butiken','shop')}`;render()}function simulate(item){if(item==='gems')s.gems+=50;else if(item==='coins')s.coins+=500;else if(item==='ads')s.adFree=true;save();modal=`<h2>✨ Testköp genomfört!</h2><p>Ingen betalning har gjorts.</p>${btn('Butik','shop')}`;render()}function ranking(){let arr=Object.entries(s.scores).sort((a,b)=>b[1]-a[1]).slice(0,15);return `<div class="panel"><h2>🏆 Dina rekord</h2><p class="small center">${s.name} • Högsta upplåsta nivå: ${s.best}</p>${arr.length?arr.map(([l,v],i)=>`<div class="rank"><span>${i+1}. Nivå ${l}</span><b>${v} poäng</b></div>`).join(''):'<p class="center">Inga rekord ännu. Spela din första nivå!</p>'}<p class="notice">En gemensam topplista med andra spelare kräver server och spelarkonton.</p>${btn('👤 Min profil','profile')}</div>${nav()}`}function profile(){return `<div class="panel"><h2>👤 Min profil</h2><p class="center">👑 ${s.name}</p><label class="small" for="playername">Spelarnamn</label><input id="playername" class="name" maxlength="18" value="${s.name.replace(/["&<>]/g,'')}"><p>🏰 Nivå ${s.best} &nbsp; ⭐ ${Object.values(s.stars).reduce((a,b)=>a+b,0)} stjärnor</p>${btn('Spara namn','saveName')}<p class="notice">Framstegen sparas automatiskt på den här enheten i den här webbläsaren. Rensa inte webbplatsdata om du vill behålla dina nivåer.</p></div>${nav()}`}function action(act,el){if(act==='home'){view='home';modal='';render()}else if(act==='map'){view='map';modal='';render()}else if(act==='shop'){view='shop';modal='';render()}else if(act==='ranking'){view='ranking';modal='';render()}else if(act==='profile'){view='profile';modal='';render()}else if(act==='world'){let i=+el.dataset.i;s.level=Math.min(s.best,i*20+1);save();view='home';prep()}else if(act==='play'){view='home';modal='';prep()}else if(act==='enterworld'){view='home';modal='';prep()}else if(act==='start')start();else if(act==='next'){view='home';prep()}else if(act==='gift'){if(s.gift!==today()){s.coins+=100;s.gift=today();save();modal=`<div style="font-size:55px">🎁</div><h2>+100 mynt!</h2><p>Kom tillbaka imorgon för en ny gåva.</p>${btn('Härligt!','close')}`;render()}}else if(act==='close'){modal='';render()}else if(act==='buy')buy(el.dataset.item);else if(act==='simulate')simulate(el.dataset.item);else if(act==='saveName'){let a=document.getElementById('playername');s.name=(a?.value||'Spelare').trim().slice(0,18)||'Spelare';save();render()}else if(['hammer','shield','slow'].includes(act))booster(act);else if(act==='pause'){round.active=false;cancelAnimationFrame(raf);modal=`<div style="font-size:50px">⏸️</div><h2>Paus</h2><p>Dina pågående poäng försvinner om du lämnar nivån.</p>${btn('Fortsätt','resume','')}${btn('Avsluta nivån','exit')}`;render()}else if(act==='resume'){modal='';round.active=true;render();last=performance.now();raf=requestAnimationFrame(tick)}else if(act==='exit'){round.active=false;modal='';view='home';render()}}document.addEventListener('pointerdown',e=>{let d=e.target.closest('[data-drop]');if(d){e.preventDefault();hit(+d.dataset.drop);paint()}});document.addEventListener('click',e=>{let d=e.target.closest('[data-drop]');if(d){e.preventDefault();return}let b=e.target.closest('[data-act]');if(b&&!b.disabled)action(b.dataset.act,b)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&view==='game'&&round?.active){round.active=false;cancelAnimationFrame(raf);modal=`<h2>Spelet pausat</h2><p>Välkommen tillbaka!</p>${btn('Fortsätt','resume')}${btn('Avsluta','exit')}`;render()}});setInterval(()=>{if(view!=='game'&&!modal){let w=document.querySelector('.wallet');if(w)w.innerHTML=`🪙 ${s.coins} &nbsp; 💎 ${s.gems}<br>❤️ ${s.lives}/5 ${s.lives<5?'⏳ '+timeUntil():''}`}},20000);render();})();
</script><script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));}</script></body></html>
